<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六边形网格测试</title>
    <style>
        body { 
            background: #1a1a1a;
            color: #ddd;
            padding: 40px;
            font-family: Arial, sans-serif;
        }
        
        .map-grid {
            display: grid;
            grid-template-columns: repeat(6, 70px);
            gap: 0;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border: 1px solid rgba(200, 151, 58, 0.2);
            width: fit-content;
            grid-auto-rows: 60px;
        }

        .cell {
            width: 70px;
            height: 70px;
            background: #2e2a1e;
            border: 2px solid rgba(200, 151, 58, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: visible;
            font-weight: 600;
            font-size: 0.8rem;
            text-align: center;
            padding: 0;
            clip-path: polygon(
                50% 0%,
                93.3% 25%,
                93.3% 75%,
                50% 100%,
                6.7% 75%,
                6.7% 25%
            );
        }

        /* 第2,4,6,8...行向右偏移 35px */
        .cell:nth-child(7),
        .cell:nth-child(8),
        .cell:nth-child(9),
        .cell:nth-child(10),
        .cell:nth-child(11),
        .cell:nth-child(12),
        .cell:nth-child(19),
        .cell:nth-child(20),
        .cell:nth-child(21),
        .cell:nth-child(22),
        .cell:nth-child(23),
        .cell:nth-child(24),
        .cell:nth-child(31),
        .cell:nth-child(32),
        .cell:nth-child(33),
        .cell:nth-child(34),
        .cell:nth-child(35),
        .cell:nth-child(36) {
            transform: translateX(35px);
        }
    </style>
</head>
<body>
    <h1>六边形网格布局测试</h1>
    <p>应该看到蜂窝状的六边形排列</p>
    
    <div class="map-grid">
        <div class="cell">1</div>
        <div class="cell">2</div>
        <div class="cell">3</div>
        <div class="cell">4</div>
        <div class="cell">5</div>
        <div class="cell">6</div>
        
        <div class="cell">7</div>
        <div class="cell">8</div>
        <div class="cell">9</div>
        <div class="cell">10</div>
        <div class="cell">11</div>
        <div class="cell">12</div>
        
        <div class="cell">13</div>
        <div class="cell">14</div>
        <div class="cell">15</div>
        <div class="cell">16</div>
        <div class="cell">17</div>
        <div class="cell">18</div>
        
        <div class="cell">19</div>
        <div class="cell">20</div>
        <div class="cell">21</div>
        <div class="cell">22</div>
        <div class="cell">23</div>
        <div class="cell">24</div>
        
        <div class="cell">25</div>
        <div class="cell">26</div>
        <div class="cell">27</div>
        <div class="cell">28</div>
        <div class="cell">29</div>
        <div class="cell">30</div>
        
        <div class="cell">31</div>
        <div class="cell">32</div>
        <div class="cell">33</div>
        <div class="cell">34</div>
        <div class="cell">35</div>
        <div class="cell">36</div>
    </div>
</body>
</html>
