<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disco Elysium — Interactive Dialogue</title>
    <link href="https://fonts.googleapis.com/css2?family=Cardo:ital@0;1&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" role="main">
        <!-- LEFT PANEL: Character Stats + Thought Cabinet -->
        <div class="left-panel" aria-label="Character stats and thoughts">
            <div class="stats-section">
                <div class="stat-bar hp-bar">
                    <div class="stat-label">HP</div>
                    <div class="stat-fill">
                        <div class="stat-value" id="hp-fill"></div>
                    </div>
                    <div class="stat-text" id="hp-text">15 / 15</div>
                </div>
                <div class="stat-bar morale-bar">
                    <div class="stat-label">MORALE</div>
                    <div class="stat-fill">
                        <div class="stat-value" id="morale-fill"></div>
                    </div>
                    <div class="stat-text" id="morale-text">7 / 10</div>
                </div>
            </div>

            <div class="thoughts-section">
                <div class="thoughts-title">Thoughts</div>
                <div class="thoughts-grid" id="thoughts-grid">
                    <!-- Generated by game.js -->
                </div>
            </div>
        </div>

        <!-- CENTER PANEL: Scene Description -->
        <div class="center-panel">
            <div class="scene-area">
                <div class="scene-text" id="scene-text">
                    <!-- Narration and dialogue appear here -->
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL: Dialogue Feed + Choices -->
        <div class="right-panel">
            <div class="dialogue-feed" id="dialogue-feed" role="log" aria-live="polite">
                <!-- Dialogue history appears here -->
            </div>
            <div class="choices-container" id="choices-container">
                <!-- Choice buttons appear here -->
            </div>
        </div>
    </div>

    <!-- OVERLAY: Screen Flash (success/failure) -->
    <div class="screen-flash" id="screen-flash"></div>

    <!-- MODAL: Skill Check -->
    <div class="modal-overlay" id="skill-check-modal">
        <div class="skill-check-dialog">
            <div class="skill-check-title" id="skill-check-title">Skill Check</div>
            <div class="dice-container">
                <div class="dice" id="dice-left">1</div>
                <div class="dice-plus">+</div>
                <div class="dice" id="dice-right">1</div>
            </div>
            <div class="skill-check-result" id="skill-check-result">
                <!-- Result appears here after roll -->
            </div>
            <button id="skill-check-button" class="skill-check-continue">Continue</button>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="game.js"></script>
</body>
</html>
